services:
  - type: web
    name: engauge-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ENGAUGE_ENV
        value: local
      - key: GROQ_API_KEY
        sync: false        # prompts you to enter manually in dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: USE_LOCAL_LLM
        value: "false"
      - key: USE_LLM
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://engauge.vercel.app,http://localhost:3000
